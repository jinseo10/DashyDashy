<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
  <title>DashyDashy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">DashyDashy</span>
      </div>
      <div class="topbar-right">
        <span class="clock" id="clock">--:--:--</span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌓</button>
        <span class="status-dot" id="conn-status" title="Connecting..."></span>
      </div>
    </header>

    <main class="grid" id="grid">
      <!-- Weather -->
      <section class="card card-weather" id="card-weather">
        <div class="card-head">
          <h2>Weather</h2>
          <span class="muted" id="weather-location">--</span>
        </div>
        <div class="weather-body">
          <span class="weather-icon" id="weather-icon">⏳</span>
          <div class="weather-main">
            <span class="stat-value" id="weather-temp">--°</span>
            <span class="muted" id="weather-condition">Loading…</span>
          </div>
        </div>
        <div class="weather-meta">
          <span>Feels like <b id="weather-feels">--°</b></span>
          <span>Humidity <b id="weather-humidity">--%</b></span>
          <span>Wind <b id="weather-wind">-- mph</b></span>
        </div>
      </section>

      <!-- CPU -->
      <section class="card" id="card-cpu">
        <div class="card-head">
          <h2>CPU</h2>
          <span class="muted" id="cpu-cores">-- cores</span>
        </div>
        <div class="stat-row">
          <span class="stat-value" id="cpu-usage">--%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
        <div class="mini-stats">
          <div><span class="muted">Clock</span><b id="cpu-freq">N/A</b></div>
          <div><span class="muted">Load (1/5/15m)</span><b id="cpu-load">-- / -- / --</b></div>
        </div>
      </section>

      <!-- Memory -->
      <section class="card" id="card-memory">
        <div class="card-head">
          <h2>Memory</h2>
          <span class="muted" id="memory-total">-- total</span>
        </div>
        <div class="stat-row">
          <span class="stat-value" id="memory-usage">--%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="memory-bar" style="width:0%"></div></div>
        <div class="mini-stats">
          <div><span class="muted">Used</span><b id="memory-used">--</b></div>
          <div><span class="muted">Swap</span><b id="memory-swap">--</b></div>
        </div>
      </section>

      <!-- Storage -->
      <section class="card card-wide" id="card-storage">
        <div class="card-head">
          <h2>Storage</h2>
        </div>
        <div class="disk-list" id="disk-list">
          <p class="muted">Loading…</p>
        </div>
      </section>

      <!-- Network -->
      <section class="card" id="card-network">
        <div class="card-head">
          <h2>Network</h2>
        </div>
        <div class="mini-stats mini-stats-stacked">
          <div><span class="muted">↓ Download</span><b id="net-rx">--</b></div>
          <div><span class="muted">↑ Upload</span><b id="net-tx">--</b></div>
        </div>
      </section>

      <!-- Uptime -->
      <section class="card" id="card-uptime">
        <div class="card-head">
          <h2>Uptime</h2>
        </div>
        <div class="stat-row">
          <span class="stat-value stat-value-small" id="uptime-value">--</span>
        </div>
      </section>

      <!-- Docker -->
      <section class="card card-wide" id="card-docker">
        <div class="card-head">
          <h2>Docker Containers</h2>
          <span class="muted" id="docker-summary">-- running</span>
        </div>
        <div class="container-list" id="container-list">
          <p class="muted">Loading…</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="last-updated">Updated --</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
