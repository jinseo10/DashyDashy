services:
  prometheus:
    image: prom/prometheus:latest
    container_name: dashydashy-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - dashydashy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: dashydashy-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.cpufreq"
    networks:
      - dashydashy

  dashboard:
    build: ./server
    container_name: dashydashy-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - WEATHER_LAT=${WEATHER_LAT:-40.7128}
      - WEATHER_LON=${WEATHER_LON:-74.0060}
      - WEATHER_LOCATION_NAME=${WEATHER_LOCATION_NAME:-New York}
      - WEATHER_UNITS=${WEATHER_UNITS:-fahrenheit}
      - DISK_MOUNTPOINTS=${DISK_MOUNTPOINTS:-/}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - prometheus
    networks:
      - dashydashy

networks:
  dashydashy:
    driver: bridge

volumes:
  prometheus-data:
