global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Only scraped successfully when the optional nvidia-gpu-exporter service
  # is running (docker compose --profile gpu-nvidia up -d); otherwise this
  # target just shows as down, which is harmless.
  - job_name: "nvidia-gpu-exporter"
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]
